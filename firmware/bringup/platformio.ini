; Bring-up test firmware for the carrier board (see README.md in this folder).
; Keep ARDUINO_USB_MODE=1 (the board default, USB-Serial/JTAG): esptool can then reset the
; XIAO into its bootloader over USB, so it reflashes without touching the BOOT/RESET buttons.

[env:xiao]
platform = espressif32 @ 6.8.1
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; Meter-friendly CAN check: 10 kHz square wave on CAN TX, prints how often RX reads low.
[env:xiao-txd-square]
extends = env:xiao
build_flags = -DTXD_SQUARE

